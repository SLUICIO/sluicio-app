#
# Sluicio cell using YOUR OWN external Postgres + ClickHouse (bring-your-own
# database). Runs only the Sluicio services — no bundled databases, no data
# volumes. Point it at your databases in the env file.
#
#   docker compose --env-file sluicio.env \
#     -f docker-compose.registry.external-db.yml up -d
#
# Required in the env file (see sluicio.env.external.example):
#   POSTGRES_DSN         postgres://user:pass@your-pg-host:5432/controlplane?sslmode=require
#   CLICKHOUSE_ENDPOINT  your-ch-host:9000
#   CLICKHOUSE_DATABASE  telemetry           (created if your CH user may create DBs)
#   CLICKHOUSE_USERNAME / CLICKHOUSE_PASSWORD
#
# cell-api applies its own Postgres migrations on startup and creates its
# ClickHouse tables — the databases just need to exist and be reachable with
# these credentials.
#
# HAVE ONLY ONE of the two? Layer a bundled overlay on top. E.g. you have
# Postgres but need ClickHouse:
#   docker compose --env-file sluicio.env \
#     -f docker-compose.registry.external-db.yml \
#     -f docker-compose.bundled-clickhouse.yml up -d
# (and vice versa with docker-compose.bundled-postgres.yml).

# Connection values default to empty so a bundled-* overlay can supply them
# without compose warning about unset variables. For a pure external setup,
# set them in the env file (sluicio.env.external.example).
x-ch-env: &ch-env
  CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-telemetry}
  # Per-query memory ceiling in bytes (default 2e9 = 1.86 GiB, which is
  # the number that shows up in "Memory limit (for query) exceeded").
  # Raise it on a host with room: a message search over a busy service
  # aggregates every trace in the window, and the ceiling is ours, not
  # ClickHouse's. Aggregations spill to disk at half this value rather
  # than failing, so a bigger number buys speed, not just survival.
  CLICKHOUSE_MAX_MEMORY_USAGE: ${CLICKHOUSE_MAX_MEMORY_USAGE:-2000000000}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

services:
  cell-api:
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-sluicio}/cell-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *ch-env
      CELL_API_ADDR: ":8081"
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      SLUICIO_APP_URL: ${SLUICIO_APP_URL:-}
      SLUICIO_INGEST_URL: ${SLUICIO_INGEST_URL:-}
      SLUICIO_LICENSE_KEY: ${SLUICIO_LICENSE_KEY:-}
      # Renewals without a restart: point this at a mounted token file and
      # cell-api re-reads it, so a term-length license is replaced by
      # copying a file. Ignored when SLUICIO_LICENSE_KEY is set.
      SLUICIO_LICENSE_FILE: ${SLUICIO_LICENSE_FILE:-}
      LICENSE_RELOAD_INTERVAL: ${LICENSE_RELOAD_INTERVAL:-1m}
      SLUICIO_MFA_KEY: ${SLUICIO_MFA_KEY:-}
      # Collector management over OpAMP (Beta): off unless true. The key
      # (base64 32 bytes, openssl rand -base64 32) encrypts stored collector
      # configurations and must stay outside the database; without it they
      # are not stored. Losing it makes stored configurations unreadable.
      SLUICIO_COLLECTORS_ENABLED: ${SLUICIO_COLLECTORS_ENABLED:-false}
      SLUICIO_COLLECTOR_CONFIG_KEY: ${SLUICIO_COLLECTOR_CONFIG_KEY:-}
      # The OTelFlow designer the Configuration tab embeds: /otelflow/ when
      # the otelflow service below runs (COMPOSE_PROFILES=collectors). Empty
      # shows configurations as YAML only.
      SLUICIO_OTELFLOW_URL: ${SLUICIO_OTELFLOW_URL:-}
    volumes:
      - ${LICENSE_DIR:-./license}:/etc/sluicio/license:ro
    ports:
      - "${CELL_API_PORT:-8081}:8081"

  cell-ingest:
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-sluicio}/cell-ingest:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *ch-env
      CELL_INGEST_ADDR: ":4318"
      POSTGRES_DSN: ${POSTGRES_DSN:-}
    ports:
      - "${CELL_INGEST_PORT:-4318}:4318"

  # OTelFlow, the collector-configuration designer collector management
  # embeds (Beta). Stateless; the reverse proxy forwards <ui-host>/otelflow/*
  # here with the path unchanged. Started only with the collectors profile:
  # set COMPOSE_PROFILES=collectors together with SLUICIO_COLLECTORS_ENABLED
  # and SLUICIO_OTELFLOW_URL=/otelflow/.
  otelflow:
    image: ${OTELFLOW_IMAGE:-ghcr.io/sluicio/otelflow:0.9.0}
    profiles: [collectors]
    restart: unless-stopped
    environment:
      OTELFLOW_PREFIX: /otelflow
    ports:
      - "127.0.0.1:${OTELFLOW_PORT:-7317}:7317"

  frontend:
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-sluicio}/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"

{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $ctx := dict "root" . "component" "frontend" -}}
{{/*
The frontend image's server listens on :80 and proxies /api to the compose
hostname `cell-api` by default; neither fits here (the Service is
release-prefixed, and :80 needs root). Both are environment variables, so
the chart sets an unprivileged port and this release's cell-api Service.
The image has no filesystem it writes to, so the pod runs as any non-root
UID with a read-only root and passes restricted-v2 and OpenShift's
restricted SCC unchanged.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cell.componentName" $ctx }}
  labels: {{- include "cell.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: {{- include "cell.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cell.selectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cell.serviceAccountName" . }}
      {{- include "cell.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- toYaml .Values.frontendPodSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "cell.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: WEB_ADDR
              value: {{ printf ":%v" .Values.frontend.containerPort | quote }}
            - name: WEB_API_UPSTREAM
              value: {{ printf "http://%s:%v" (include "cell.componentName" (dict "root" . "component" "cell-api")) .Values.cellApi.service.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cell.componentName" $ctx }}
  labels: {{- include "cell.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector: {{- include "cell.selectorLabels" $ctx | nindent 4 }}
